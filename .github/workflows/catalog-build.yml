name: Catalog build

# Builds the FULL catalog from catalog/sources.txt (every listed project's latest
# GitHub release), checks it with abv0 itself and publishes the result, UNSIGNED,
# to the branch `catalog-unsigned`. Nothing here signs anything and no other
# branch is ever written: a maintainer reviews packages/index.json on that branch
# and signs it (see catalog.yml and catalog/README.md).
#
# Needs no secrets. GITHUB_TOKEN raises the API limit to 1,000 requests an hour
# per repository (shared by every workflow of the repository) and lets the run
# push its one branch.
#
# API use is kept small on purpose: the builder looks projects up in GraphQL
# batches of 40 (about 10 requests for the whole catalog instead of two per
# project), sends If-None-Match for the REST calls it still makes (an ETag cache
# kept with actions/cache; a 304 costs no quota), and waits for the rate limit to
# reset when that takes at most 50 minutes. If the limit cannot be waited out,
# the sources it has not looked at keep their previous entries: they are reported
# as "rate limited (carried forward)", not as failures, and the run still ends
# green with a complete catalog.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild every package, even those whose version is unchanged"
        type: boolean
        required: false
        default: false
  push:
    # Work branches only; main has its own scheduled runs.
    branches-ignore:
      - main
      - catalog-unsigned
    paths:
      - "catalog/**"
      - "tools/build-catalog.zig"
      - "tools/catalog_api.zig"
      - "tools/discover.zig"
      - "src/bindetect.zig"
      - ".github/workflows/catalog-build.yml"

permissions:
  contents: write

# One build at a time: two runs would race on the catalog-unsigned branch.
concurrency:
  group: catalog-build
  cancel-in-progress: false

env:
  UNSIGNED_BRANCH: catalog-unsigned
  # Sources processed in parallel. The work is network bound.
  CATALOG_JOBS: "8"

jobs:
  build:
    name: Build, validate and publish unsigned
    runs-on: ubuntu-latest
    # Room for a 50 minute rate-limit wait plus the downloads and validation.
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7 # v1
        with:
          version: 0.13.0

      - name: Build abv0 and the catalog tool
        run: zig build install catalog-tool -Doptimize=ReleaseSafe

      - name: Pick the previous catalog
        # Unchanged versions are reused without a download. The last unsigned
        # build is the best source of those; the committed catalog is the fallback.
        run: |
          set -euo pipefail
          prev="${RUNNER_TEMP}/previous.json"
          if git fetch --quiet --depth=1 origin "+refs/heads/${UNSIGNED_BRANCH}:refs/remotes/origin/${UNSIGNED_BRANCH}" 2>/dev/null \
             && git show "origin/${UNSIGNED_BRANCH}:packages/index.json" > "${prev}" 2>/dev/null; then
            echo "Previous catalog: ${UNSIGNED_BRANCH} ($(git rev-parse --short "origin/${UNSIGNED_BRANCH}"))"
          else
            cp packages/index.json "${prev}"
            echo "Previous catalog: packages/index.json (no ${UNSIGNED_BRANCH} branch yet)"
          fi
          echo "PREVIOUS=${prev}" >> "${GITHUB_ENV}"

      - name: Week key for the ETag cache
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "${GITHUB_OUTPUT}"

      - name: Restore the ETag cache
        # REST lookups send If-None-Match from this cache; a 304 is free. One
        # cache per ISO week keeps it from growing without bound.
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/catalog-etag
          key: catalog-etag-${{ steps.week.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            catalog-etag-${{ steps.week.outputs.week }}-
            catalog-etag-

      - name: Discover popular projects
        # The same search the daily Catalog workflow runs weekly. A partial
        # search falls back to the committed list, if any.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          auto="${RUNNER_TEMP}/auto-sources.txt"
          rejects="${RUNNER_TEMP}/auto-rejects.txt"
          if [ -f catalog/auto-rejects.txt ]; then cp catalog/auto-rejects.txt "${rejects}"; fi
          prev=()
          if [ -f catalog/auto-sources.txt ]; then prev=(--previous catalog/auto-sources.txt); fi
          # An incomplete search still writes what it found plus the last list.
          if ! ./zig-out/bin/build-catalog discover --out "${auto}" "${prev[@]}" --max-wait-min 40 2>&1 | tee "${RUNNER_TEMP}/discover.log"; then
            echo "::warning title=Discovery incomplete::the search stopped early; what it found is used"
          fi
          touch "${auto}"
          echo "discovered: $(grep -vc '^#' "${auto}" || true) projects"
          echo "AUTO=${auto}" >> "${GITHUB_ENV}"
          echo "REJECTS=${rejects}" >> "${GITHUB_ENV}"

      - name: Build the full catalog from upstream releases
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/catalog-out"
          mkdir -p "${out}" .cache/catalog-etag
          args=(--sources catalog/sources.txt --manual catalog/manual.json
                --auto-sources "${AUTO}" --rejects "${REJECTS}"
                --out "${out}/index.json" --previous "${PREVIOUS}"
                --jobs "${CATALOG_JOBS}" --allow-failures
                --max-wait-min 50 --etag-cache .cache/catalog-etag/etag.json
                --summary "${RUNNER_TEMP}/build-summary.md")
          if [ "${INPUT_FORCE:-false}" = "true" ]; then args+=(--force); fi
          start="$(date +%s)"
          ./zig-out/bin/build-catalog "${args[@]}" 2>&1 | tee "${RUNNER_TEMP}/build.log"
          echo "wall clock: $(( $(date +%s) - start )) s"
          echo "OUT=${out}/index.json" >> "${GITHUB_ENV}"
          # A rate limit is not a failure, but a maintainer should see it.
          if grep -q '^warning: the GitHub API rate limit stopped' "${RUNNER_TEMP}/build.log"; then
            echo "::warning title=Catalog build was rate limited::$(grep -m1 '^warning: the GitHub API rate limit stopped' "${RUNNER_TEMP}/build.log")"
          fi

      - name: Save the ETag cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/catalog-etag
          key: catalog-etag-${{ steps.week.outputs.week }}-${{ github.run_id }}

      - name: Validate with abv0
        run: |
          set -euo pipefail
          abv0=./zig-out/bin/abv0
          home="$(mktemp -d)"

          # 1. abv0 loads the registry (every package passes its loader) and
          #    lists as many packages as the file holds.
          expected="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["packages"]))' "${OUT}")"
          listed="$(HOME="${home}" "${abv0}" --registry "${OUT}" --allow-unsigned-manifest list | tee "${RUNNER_TEMP}/list.txt" | tail -n 1)"
          echo "abv0 list: ${listed} (file holds ${expected})"
          case "${listed}" in
            "${expected} packages") ;;
            *) echo "::error title=Catalog does not load::abv0 listed '${listed}', the file holds ${expected} packages"; exit 1 ;;
          esac

          # 2. A dry-run install of 10 random packages that have a Linux x86_64 build.
          python3 - "${OUT}" > "${RUNNER_TEMP}/sample.txt" <<'PY'
          import json, random, sys
          packages = json.load(open(sys.argv[1]))["packages"]
          names = sorted(n for n, p in packages.items() if "x86_64-linux" in p["platforms"])
          random.shuffle(names)
          print("\n".join(sorted(names[:10])))
          PY
          mapfile -t sample < "${RUNNER_TEMP}/sample.txt"
          echo "dry-run sample (${#sample[@]}): ${sample[*]}"
          if [ "${#sample[@]}" -lt 10 ]; then
            echo "::error title=Too few Linux packages::only ${#sample[@]} packages have an x86_64-linux build"
            exit 1
          fi
          HOME="${home}" "${abv0}" --registry "${OUT}" --allow-unsigned-manifest --dry-run install "${sample[@]}" \
            | tee "${RUNNER_TEMP}/dry-run.txt"
          for name in "${sample[@]}"; do
            if ! awk -v n="${name}" '$1 == "install" && $2 == n { found = 1 } END { exit !found }' "${RUNNER_TEMP}/dry-run.txt"; then
              echo "::error title=Dry run failed::${name} would not be installed"
              exit 1
            fi
          done
          if awk '$1 == "unknown" { found = 1 } END { exit !found }' "${RUNNER_TEMP}/dry-run.txt"; then
            echo "::error title=Dry run failed::a package is not in the catalog"
            exit 1
          fi

      - name: Write the job summary
        if: always()
        run: |
          {
            if [ -f "${RUNNER_TEMP}/build-summary.md" ]; then
              cat "${RUNNER_TEMP}/build-summary.md"
            else
              echo '### Catalog build'
              echo
              echo 'The builder did not finish; see the log.'
            fi
            echo
            if [ -f "${RUNNER_TEMP}/sample.txt" ]; then
              echo '#### Validation'
              echo
              echo "- \`abv0 --registry … list\`: $(tail -n 1 "${RUNNER_TEMP}/list.txt" 2>/dev/null || echo 'not run')"
              echo "- dry-run install (linux x86_64) of: $(paste -sd' ' "${RUNNER_TEMP}/sample.txt")"
              echo
            fi
            if [ -f "${RUNNER_TEMP}/build.log" ]; then
              echo '<details><summary>Builder log (tail)</summary>'
              echo
              echo '```'
              tail -n 60 "${RUNNER_TEMP}/build.log"
              echo '```'
              echo '</details>'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish packages/index.json (unsigned) to the catalog-unsigned branch
        run: |
          set -euo pipefail
          new_blob="$(git hash-object "${OUT}")"
          if old_blob="$(git rev-parse --verify --quiet "origin/${UNSIGNED_BRANCH}:packages/index.json")" \
             && [ "${old_blob}" = "${new_blob}" ]; then
            echo "Catalog identical to ${UNSIGNED_BRANCH}; nothing to push."
            echo "Catalog identical to \`${UNSIGNED_BRANCH}\`; nothing pushed." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # A throwaway worktree holding one orphan commit with one file. The
          # checked-out branch and every other branch stay as they are.
          wt="${RUNNER_TEMP}/unsigned-wt"
          git worktree add --quiet --detach "${wt}" HEAD
          cd "${wt}"
          git checkout --quiet --orphan unsigned-publish
          git rm -rf --quiet --ignore-unmatch .
          mkdir -p packages
          cp "${OUT}" packages/index.json
          git add packages/index.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "chore(catalog): unsigned build ${GITHUB_SHA::12}" \
                     -m "packages/index.json only, NOT signed. Built by workflow run ${GITHUB_RUN_ID} from ${GITHUB_REPOSITORY}@${GITHUB_SHA}. A maintainer must review and sign it before it is published."
          # An explicit refspec: only this one ref can change.
          git push --force origin "HEAD:refs/heads/${UNSIGNED_BRANCH}"
          echo "Pushed $(git rev-parse --short HEAD) to \`${UNSIGNED_BRANCH}\` (unsigned)." >> "${GITHUB_STEP_SUMMARY}"

      - name: Keep the build outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-unsigned
          path: |
            ${{ runner.temp }}/catalog-out/index.json
            ${{ runner.temp }}/build-summary.md
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/auto-sources.txt
            ${{ runner.temp }}/auto-rejects.txt
            ${{ runner.temp }}/discover.log
          if-no-files-found: ignore
          retention-days: 14
